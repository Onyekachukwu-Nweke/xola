[package]
name = "xola-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[dependencies]
# Async runtime - everything async lives here
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "net"] }

# Tokio utilities - CancellationToken for hierarchical timeouts (L4-06)
tokio-util = "0.7"

# Async trait support for dyn-compatible async methods
async-trait = "0.1"

# Structured data serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling with derive macros
thiserror = "2.0"

# JSON Schema validation for tool inputs
jsonschema = "0.26"

# HTTP client for URL fetching
# Using native-tls (system OpenSSL) for better compatibility than rustls
reqwest = { version = "0.12", features = ["json"] }

# Docker client for sandboxed code execution (L1-07)
bollard = "0.20"

# Stream utilities for consuming bollard log streams
futures-util = "0.3"

# UUID generation for container naming
uuid = { version = "1.11", features = ["v4", "serde"] }

# Async Postgres driver with compile-time query checking and migration runner (L2)
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

# Timestamp support for memory / episode records
chrono = { version = "0.4", features = ["serde"] }

# pgvector Vector type — maps Vec<f32> to Postgres vector columns (L2-04)
pgvector = { version = "0.4", features = ["sqlx"] }

# .env loader — called once in main() for local dev; silently no-ops in prod
# where variables are injected by Docker/systemd/Kubernetes.
dotenvy = "0.15"

# Structured logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# OpenTelemetry: traces + metrics via OTel SDK (L5-01, L5-02, L5-03)
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"
opentelemetry-prometheus = "0.31"

# HTTP server for /metrics endpoint (L5-03) and future Web UI (L5-05)
axum = "0.8"

# TOML config file parsing
toml = "0.9"
prometheus = "0.14"

[dev-dependencies]
tokio-test = "0.4"
